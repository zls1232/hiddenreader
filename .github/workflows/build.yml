name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Release (unsigned)
        run: |
          xcodebuild \
            -project HiddenReader.xcodeproj \
            -scheme HiddenReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Self-sign with distribution cert
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/HiddenReader.app"
          # 1) 生成分发类型自签证书
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout key.pem -out cert.pem -days 3650 -config openssl.cnf
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -passout pass:
          # 2) 临时 keychain 导入并签名
          security create-keychain -p "" sign.keychain
          security default-keychain -s sign.keychain
          security unlock-keychain -p "" sign.keychain
          security import cert.p12 -k sign.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" sign.keychain
          codesign -f -s "Apple Distribution: DSH (0000000000)" \
            --entitlements entitlements.plist "$APP"
          # 3) 验证签名
          codesign -dvv "$APP" 2>&1 | head -20 || true

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/HiddenReader.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r HiddenReader.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HiddenReader.ipa
          path: HiddenReader.ipa

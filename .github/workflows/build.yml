name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Release (unsigned)
        run: |
          xcodebuild \
            -project HiddenReader.xcodeproj \
            -scheme HiddenReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Fake-sign app (ldid)
        run: |
          APP="build/Build/Products/Release-iphoneos/HiddenReader.app"
          brew install ldid 2>/dev/null || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "$APP/HiddenReader"
            echo "ldid fakesign done"
          else
            codesign -f -s - "$APP"
            echo "codesign ad-hoc done"
          fi

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/HiddenReader.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r HiddenReader.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HiddenReader.ipa
          path: HiddenReader.ipa

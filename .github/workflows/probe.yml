name: Probe Xcode

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: List Xcode versions
        run: |
          echo "=== /Applications 里的 Xcode ==="
          ls /Applications | grep -i xcode || echo "无"
          echo "=== 默认 xcodebuild ==="
          xcodebuild -version 2>&1 | head -3
